<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .profile {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        p {
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="profile">
    <h2>Profile</h2>

    <p><strong>Name:</strong> {{ user }}</p>
    <p><strong>Email:</strong> {{ email }}</p>

    <form action="/logout" method="get">
        <button type="submit">Logout</button>
    </form>
</div>

</body>
</html>
